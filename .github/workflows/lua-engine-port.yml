  windows-demo:
    needs: api-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Pillow for real VoxeLibre textures
        run: python -m pip install pillow
      - name: Build Lua game archive
        run: python scripts/package_lua_engine.py --output dist/Motor-Lua-Demo.lovr --require-upstream-textures
      - name: Download LÖVR 0.19 Windows runtime and assemble fused .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/bjornbytes/lovr/releases/download/v0.19.0/lovr-v0.19.0-win64.zip' -OutFile 'lovr-runtime.zip'
          Expand-Archive -Path 'lovr-runtime.zip' -DestinationPath 'runtime'
          $runtime = Get-ChildItem 'runtime' -Filter 'lovr.exe' -Recurse -File | Select-Object -First 1
          if (-not $runtime) { throw 'Cannot find lovr.exe in official runtime' }
          $output = Join-Path (Get-Location) 'dist/Motor-Lua-Demo.exe'
          $outStream = [System.IO.File]::Create($output)
          try {
            $exe = [System.IO.File]::OpenRead($runtime.FullName)
            try { $exe.CopyTo($outStream) } finally { $exe.Dispose() }
            $game = [System.IO.File]::OpenRead((Join-Path (Get-Location) 'dist/Motor-Lua-Demo.lovr'))
            try { $game.CopyTo($outStream) } finally { $game.Dispose() }
          } finally { $outStream.Dispose() }
          Get-ChildItem $runtime.DirectoryName -Filter '*.dll' -File | Copy-Item -Destination 'dist'
          if (@(Get-ChildItem 'dist' -Filter '*.dll').Count -lt 1) { throw 'Missing DLLs' }
          if ((Get-Item $output).Length -le $runtime.Length) { throw 'Fused EXE is incomplete' }
      - name: Explain experimental status
        shell: pwsh
        run: |
          @'
          EXPERIMENTAL LUA ENGINE - DEMO
          ==============================
          Run Motor-Lua-Demo.exe after extracting the entire ZIP.
          WASD: move | mouse: look | Space/Ctrl: up/down | Shift: sprint
          Left click: remove node | Right click: place stone | F6: save

          IMPORTANT: Does not run VoxeLibre yet.
          Not a complete or 1:1 Luanti engine.
          Uses visible-face mapblock meshes with original VoxeLibre textures.
          License and credits: visual/licenses/ inside the .lovr archive.
          Upstream texture atlas contains first water animation frame only.
          It does not yet run the full VoxeLibre game.
          Visual behavior on a real Windows GPU has not been verified.
          Windows 64-bit and Vulkan-capable graphics are required.
          '@ | Set-Content -Path 'dist/LEIA-ME.txt' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Motor-Lua-Experimental-Windows-x64
          path: |
            dist/Motor-Lua-Demo.exe
            dist/*.dll
            dist/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 30

  voxelibre-audit:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install Lua for API export
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Boot original VoxeLibre mods under Lua 5.4
        run: |
          mkdir -p dist
          lua5.4 tests/lua_engine_real_voxelibre.lua games/voxelibre dist/VoxeLibre-Real-Mod-Boot.md
      - name: Boot same original mods under LuaJIT
        run: luajit tests/lua_engine_real_voxelibre.lua games/voxelibre
      - name: Probe real doc and doc_items dependencies (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_doc_bootstrap.lua games/voxelibre dist/VoxeLibre-Doc-Bootstrap.md
          luajit tests/lua_engine_doc_bootstrap.lua games/voxelibre
      - name: Report directly referenced VoxeLibre APIs not yet exported
        run: |
          mkdir -p dist
          lua5.4 scripts/export_lua_engine_api.lua > dist/lua-engine-api-exports.txt
          python3 scripts/audit_voxelibre_api.py \
            --game games/voxelibre \
            --supported dist/lua-engine-api-exports.txt \
            --output dist/VoxeLibre-Lua-API-Audit.md
      - name: Analyze full required dependency chain for upstream mcl_core
        run: |
          python3 scripts/mcl_core_dependencies.py \
            --game games/voxelibre --mod mcl_core \
            --output dist/VoxeLibre-mcl_core-Dependencies.md
      - uses: actions/upload-artifact@v4
        with:
          name: VoxeLibre-Lua-API-Compatibility-Audit
          path: |
            dist/VoxeLibre-Lua-API-Audit.md
            dist/VoxeLibre-Real-Mod-Boot.md
            dist/VoxeLibre-Doc-Bootstrap.md
            dist/VoxeLibre-mcl_core-Dependencies.md
          if-no-files-found: error
          retention-days: 30


  performance-baseline:
    # Independent of correctness tests; compare times only between runs
    # on equivalent hardware, never impose a flaky absolute timing limit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Run deterministic quick CPU benchmarks under Lua 5.4
        run: |
          mkdir -p dist
          lua5.4 benchmarks/lua_engine_perf.lua --quick --samples=2 --output=dist/LuaEngine-Perf-Lua54.json
      - name: Run identical CPU benchmarks under LuaJIT
        run: luajit benchmarks/lua_engine_perf.lua --quick --samples=2 --output=dist/LuaEngine-Perf-LuaJIT.json
      - name: Check reports and indexed-versus-linear result equivalence
        run: |
          python3 scripts/check_lua_engine_benchmarks.py \
            dist/LuaEngine-Perf-Lua54.json dist/LuaEngine-Perf-LuaJIT.json
      - name: Upload benchmark baseline JSON
        uses: actions/upload-artifact@v4
        with:
          name: Motor-Lua-Performance-Baseline
          path: dist/LuaEngine-Perf-*.json
          if-no-files-found: error
          retention-days: 30
