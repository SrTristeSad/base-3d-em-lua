  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Pillow for original-texture atlas
        run: python3 -m pip install pillow
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Syntax check for standalone Lua engine
        run: find lua-engine -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Persistent segmented mapblock streaming (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_mapblock_streaming.lua
          luajit tests/lua_engine_mapblock_streaming.lua
      - name: Resident active mapblock lifecycle and saved game time (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_active_mapblocks.lua
          luajit tests/lua_engine_active_mapblocks.lua
      - name: Luanti 5.18 LBM activation, persistence and bulk callbacks (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_lbm_activation.lua
          luajit tests/lua_engine_lbm_activation.lua
      - name: Luanti mapblock light bank baking and fix_light regression (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_lightbank_rebuild.lua
          luajit tests/lua_engine_lightbank_rebuild.lua
      - name: GPU vertex light colors, day/night and corner-mapblock invalidation (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_vertex_light_render.lua
          luajit tests/lua_engine_vertex_light_render.lua
      - name: Luanti generated sunlight, cave occlusion and saved world regression (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_natural_sunlight.lua
          luajit tests/lua_engine_natural_sunlight.lua
      - name: Luanti light source propagation, day/night banks and occlusion (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_light_banks.lua
          luajit tests/lua_engine_light_banks.lua
      - name: Original Luanti player privileges, chat transport and protection callbacks (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_auth_chat_protection.lua
          luajit tests/lua_engine_auth_chat_protection.lua
      - name: Native Luanti node search, bulk operations and metadata lifecycle (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_node_api_parity.lua
          luajit tests/lua_engine_node_api_parity.lua
      - name: Run runtime/API, mapblock and persistence tests
        run: lua5.4 tests/lua_engine_core.lua
      - name: Run same API suite on LuaJIT (LÖVR runtime)
        run: luajit tests/lua_engine_core.lua
      - name: ItemStack, InvRef, metadata save and dependency loader (Lua 5.4)
        run: lua5.4 tests/lua_engine_inventory_modloader.lua
      - name: Same inventory and mod loader tests on LuaJIT
        run: luajit tests/lua_engine_inventory_modloader.lua
      - name: Luanti StorageRef world persistence and mod reload (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_mod_storage_persistence.lua
          luajit tests/lua_engine_mod_storage_persistence.lua
      - name: Shaped, shapeless, groups, cooking and inventory transactions (Lua 5.4)
        run: lua5.4 tests/lua_engine_crafting.lua
      - name: Same crafting tests on LuaJIT
        run: luajit tests/lua_engine_crafting.lua
      - name: PCG32 golden vectors and bitops fallback (Lua 5.4)
        run: lua5.4 tests/lua_engine_rng.lua
      - name: Same PCG32 golden vectors on LuaJIT
        run: luajit tests/lua_engine_rng.lua
      - name: VoxelManip, IDs, mapblocks and biome registry (Lua 5.4)
        run: lua5.4 tests/lua_engine_voxel.lua
      - name: Same voxel tests on LuaJIT
        run: luajit tests/lua_engine_voxel.lua
      - name: Deterministic chunk terrain and persistence (Lua 5.4)
        run: lua5.4 tests/lua_engine_worldgen.lua
      - name: Same worldgen tests on LuaJIT
        run: luajit tests/lua_engine_worldgen.lua
      - name: Original item/node custom callbacks and pointed interactions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_custom_interactions.lua
          luajit tests/lua_engine_custom_interactions.lua
      - name: Timed mining, tool wear and callbacks (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_timed_digging.lua
          luajit tests/lua_engine_timed_digging.lua
      - name: Native Luanti dig parameters and placement regression (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_native_dig_params.lua
          luajit tests/lua_engine_native_dig_params.lua
      - name: Luanti node orientation, core.item_place and metadata preservation (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_placement_metadata.lua
          luajit tests/lua_engine_placement_metadata.lua
      - name: Attached-node placement, direction tables and creative mining (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_attached_nodes.lua
          luajit tests/lua_engine_attached_nodes.lua
      - name: Support loss, falling entity physics and dropped items (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_falling_nodes.lua
          luajit tests/lua_engine_falling_nodes.lua
      - name: Dynamic LÖVR rendering of falling blocks and items (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_dynamic_rendering.lua
          luajit tests/lua_engine_dynamic_rendering.lua
      - name: Automatic pickup, leftovers, callbacks and metadata (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_item_pickup.lua
          luajit tests/lua_engine_item_pickup.lua
      - name: Item physics, swept collisions and safe object saves (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_item_physics_persistence.lua
          luajit tests/lua_engine_item_physics_persistence.lua
      - name: Precise nodebox and liquid item physics (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_item_nodebox_liquids.lua
          luajit tests/lua_engine_item_nodebox_liquids.lua
      - name: Embedded item recovery and validated player punch (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_item_player_interaction.lua
          luajit tests/lua_engine_item_player_interaction.lua
      - name: Geometric raycast, object occlusion and aiming pickup (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_raycast_entities.lua
          luajit tests/lua_engine_raycast_entities.lua
      - name: Registered LuaEntity callbacks, ObjectRefs and raycast (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_registered_entities.lua
          luajit tests/lua_engine_registered_entities.lua
      - name: Persistent LuaEntity staticdata and recovery (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_entity_persistence.lua
          luajit tests/lua_engine_entity_persistence.lua
      - name: Swept LuaEntity terrain physics and collision moveresult (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_entity_collision_physics.lua
          luajit tests/lua_engine_entity_collision_physics.lua
      - name: Entity stepheight, object collisions and persistence (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_entity_stepheight_objects.lua
          luajit tests/lua_engine_entity_stepheight_objects.lua
      - name: Connected player collision and safe entity overlap recovery (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_entity_player_overlap.lua
          luajit tests/lua_engine_entity_player_overlap.lua
      - name: Adaptive moving collisions and live player pairs (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_dynamic_collision_pairs.lua
          luajit tests/lua_engine_dynamic_collision_pairs.lua
      - name: Precise opposing contacts and multi-body collision records (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_multibody_contact_events.lua
          luajit tests/lua_engine_multibody_contact_events.lua
      - name: Sparse entity collision hash, live updates and player broadphase (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_spatial_collision_index.lua
          luajit tests/lua_engine_spatial_collision_index.lua
      - name: Spatial LuaEntity proximity and indexed multi-body event discovery (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_spatial_proximity_events.lua
          luajit tests/lua_engine_spatial_proximity_events.lua
      - name: Cached nodeboxes, map invalidation and character physics (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_collision_geometry_cache.lua
          luajit tests/lua_engine_collision_geometry_cache.lua
      - name: Sparse mapblock node collisions and exact wide swept AABB equivalence (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_sparse_node_collisions.lua
          luajit tests/lua_engine_sparse_node_collisions.lua
      - name: Adaptive dense terrain collisions and sparse mapblock correctness (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_adaptive_node_collision_scan.lua
          luajit tests/lua_engine_adaptive_node_collision_scan.lua
      - name: Mixed mapblock ordering, geometry and player/NPC boundary collisions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_mixed_terrain_mapblock_merge.lua
          luajit tests/lua_engine_mixed_terrain_mapblock_merge.lua
      - name: Live terrain edits, localized collision cache and same-frame NPC/player physics (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_live_terrain_collision_updates.lua
          luajit tests/lua_engine_live_terrain_collision_updates.lua
      - name: Playable singleplayer profile, hotbar and loaded-world physics (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_player_profile_hotbar.lua
          luajit tests/lua_engine_player_profile_hotbar.lua
      - name: Inventory screen, 2x2 crafting and persistent ingredients (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_playable_inventory_crafting.lua
          luajit tests/lua_engine_playable_inventory_crafting.lua
      - name: Playable crafting table 3x3, recipe and persistence (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_crafting_table_3x3.lua
          luajit tests/lua_engine_crafting_table_3x3.lua
      - name: Player inventory, wield and node interactions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_player_gameplay.lua
          luajit tests/lua_engine_player_gameplay.lua
      - name: Host player position, velocity, control and property APIs (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_player_objectref.lua
          luajit tests/lua_engine_player_objectref.lua
      - name: Formspec sessions, field event routing and player metadata (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_sessions.lua
          luajit tests/lua_engine_formspec_sessions.lua
      - name: Luanti inventory swaps, put and take callbacks (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_inventory_swap_put_take.lua
          luajit tests/lua_engine_inventory_swap_put_take.lua
      - name: Actual Luanti player inventory moves and callback transactions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_player_inventory_actions.lua
          luajit tests/lua_engine_player_inventory_actions.lua
      - name: Luanti formspec field, textarea, checkbox, dropdown and Enter actions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_input_controls.lua
          luajit tests/lua_engine_formspec_input_controls.lua
      - name: Luanti scrollbar options, track, CHG and VAL event parity (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_scrollbar.lua
          luajit tests/lua_engine_formspec_scrollbar.lua
      - name: Nested Luanti scroll containers, horizontal movers and wheel priority (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_nested_scroll.lua
          luajit tests/lua_engine_formspec_nested_scroll.lua
      - name: Partially clipped Luanti scroll_container controls, real GPU scissor and mouse events (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_scroll_clip.lua
          luajit tests/lua_engine_formspec_scroll_clip.lua
      - name: Luanti original background auto_clip geometry and background parent layering (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_background_clip.lua
          luajit tests/lua_engine_formspec_background_clip.lua
      - name: Source-resolution Luanti nine-slice, original button skins and mouse interactions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_nine_slice.lua
          luajit tests/lua_engine_formspec_nine_slice.lua
      - name: Untouched upstream formspec textures and verticalframe UVs (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_original_images.lua
          luajit tests/lua_engine_formspec_original_images.lua
      - name: Original atlas sprites in formspec controls, graphics cache and mouse actions (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_atlas_sprites.lua
          luajit tests/lua_engine_formspec_atlas_sprites.lua
      - name: Real client-side Luanti formspec view, input and LÖVR GPU bridge (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_formspec_view.lua
          luajit tests/lua_engine_formspec_view.lua
      - name: Unmodified VoxeLibre stonecutter operated through formspec mouse controls (Lua 5.4 and LuaJIT)
        run: |
