name: Luanti Lua Engine Port - API and Windows Demo

on:
  push:
    paths:
      - 'lua-engine/**'
      - 'tests/lua_engine_core.lua'
      - 'tests/lua_engine_serialization.lua'
      - 'tests/lua_engine_vector_extended.lua'
      - 'tests/lua_engine_inventory_modloader.lua'
      - 'tests/lua_engine_crafting.lua'
      - 'tests/lua_engine_real_voxelibre.lua'
      - 'tests/lua_engine_doc_bootstrap.lua'
      - 'tests/lua_engine_rng.lua'
      - 'tests/lua_engine_voxel.lua'
      - 'tests/lua_engine_worldgen.lua'
      - 'tests/lua_engine_meshing.lua'
      - 'tests/lua_engine_nodebox.lua'
      - 'tests/lua_engine_nodebox_dynamic.lua'
      - 'tests/lua_engine_physics.lua'
      - 'tests/lua_engine_movement_media.lua'
      - 'tests/lua_engine_sneak.lua'
      - 'tests/lua_engine_physics_overrides.lua'
      - 'tests/lua_engine_atlas_manifest.lua'
      - 'tests/lua_engine_materials.lua'
      - 'tests/test_lua_engine_upstream_atlas.py'
      - 'tests/lua_engine_particles_inventory.lua'
      - 'tests/lua_engine_nodedrops.lua'
      - 'tests/lua_engine_pseudorandom.lua'
      - 'scripts/mcl_core_dependencies.py'
      - 'scripts/audit_voxelibre_api.py'
      - 'scripts/export_lua_engine_api.lua'
      - 'scripts/package_lua_engine.py'
      - 'scripts/build_lua_engine_atlas.py'
      - '.github/workflows/lua-engine-port.yml'
      - 'docs/ENGINE_LUA_PORT.md'
  pull_request:
    paths:
      - 'lua-engine/**'
      - 'tests/lua_engine_core.lua'
      - 'tests/lua_engine_serialization.lua'
      - 'tests/lua_engine_vector_extended.lua'
      - 'tests/lua_engine_inventory_modloader.lua'
      - 'tests/lua_engine_crafting.lua'
      - 'tests/lua_engine_real_voxelibre.lua'
      - 'tests/lua_engine_doc_bootstrap.lua'
      - 'tests/lua_engine_rng.lua'
      - 'tests/lua_engine_voxel.lua'
      - 'tests/lua_engine_worldgen.lua'
      - 'tests/lua_engine_meshing.lua'
      - 'tests/lua_engine_nodebox.lua'
      - 'tests/lua_engine_nodebox_dynamic.lua'
      - 'tests/lua_engine_physics.lua'
      - 'tests/lua_engine_movement_media.lua'
      - 'tests/lua_engine_sneak.lua'
      - 'tests/lua_engine_physics_overrides.lua'
      - 'tests/lua_engine_atlas_manifest.lua'
      - 'tests/lua_engine_materials.lua'
      - 'tests/test_lua_engine_upstream_atlas.py'
      - 'tests/lua_engine_particles_inventory.lua'
      - 'scripts/mcl_core_dependencies.py'
      - 'scripts/audit_voxelibre_api.py'
      - 'scripts/export_lua_engine_api.lua'
      - 'scripts/package_lua_engine.py'
      - 'scripts/build_lua_engine_atlas.py'
      - '.github/workflows/lua-engine-port.yml'
      - 'docs/ENGINE_LUA_PORT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Pillow for original-texture atlas
        run: python3 -m pip install pillow
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Syntax check for standalone Lua engine
        run: find lua-engine -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run runtime/API, mapblock and persistence tests
        run: lua5.4 tests/lua_engine_core.lua
      - name: Run same API suite on LuaJIT (LÖVR runtime)
        run: luajit tests/lua_engine_core.lua
      - name: ItemStack, InvRef, metadata save and dependency loader (Lua 5.4)
        run: lua5.4 tests/lua_engine_inventory_modloader.lua
      - name: Same inventory and mod loader tests on LuaJIT
        run: luajit tests/lua_engine_inventory_modloader.lua
      - name: Shaped, shapeless, groups, cooking and inventory transactions (Lua 5.4)
        run: lua5.4 tests/lua_engine_crafting.lua
      - name: Same crafting tests on LuaJIT
        run: luajit tests/lua_engine_crafting.lua
      - name: PCG32 golden vectors and bitops fallback (Lua 5.4)
        run: lua5.4 tests/lua_engine_rng.lua
      - name: Same PCG32 golden vectors on LuaJIT
        run: luajit tests/lua_engine_rng.lua
      - name: VoxelManip, IDs, mapblocks and biome registry (Lua 5.4)
        run: lua5.4 tests/lua_engine_voxel.lua
      - name: Same voxel tests on LuaJIT
        run: luajit tests/lua_engine_voxel.lua
      - name: Deterministic chunk terrain and persistence (Lua 5.4)
        run: lua5.4 tests/lua_engine_worldgen.lua
      - name: Same worldgen tests on LuaJIT
        run: luajit tests/lua_engine_worldgen.lua
      - name: Luanti physics overrides and collision-material friction (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_physics_overrides.lua
          luajit tests/lua_engine_physics_overrides.lua
      - name: Sneak edge protection, crouch camera and partial boxes (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_sneak.lua
          luajit tests/lua_engine_sneak.lua
      - name: Acceleration, friction, swimming and ladders (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_movement_media.lua
          luajit tests/lua_engine_movement_media.lua
      - name: Character physics against real node collision boxes (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_physics.lua
          luajit tests/lua_engine_physics.lua
      - name: Dynamic connected, leveled and wallmounted geometry (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_nodebox_dynamic.lua
          luajit tests/lua_engine_nodebox_dynamic.lua
      - name: Nodebox and 24 facedir orientations (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_nodebox.lua
          luajit tests/lua_engine_nodebox.lua
      - name: Visible-face meshing and cached LÖVR buffers (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_meshing.lua
          luajit tests/lua_engine_meshing.lua
      - name: Full 2900-slot texture atlas lookup (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_atlas_manifest.lua
          luajit tests/lua_engine_atlas_manifest.lua
      - name: Translucent cubes, water and plantlike mesh (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_materials.lua
          luajit tests/lua_engine_materials.lua
      - name: Verify real upstream texture pixels and licensing
        run: python3 tests/test_lua_engine_upstream_atlas.py
      - name: Particle registry and player inventory permissions (Lua 5.4)
        run: lua5.4 tests/lua_engine_particles_inventory.lua
      - name: Same particle and permission tests on LuaJIT
        run: luajit tests/lua_engine_particles_inventory.lua
      - name: Node drop rules and item return values (Lua 5.4)
        run: lua5.4 tests/lua_engine_nodedrops.lua
      - name: Same node drops tests on LuaJIT
        run: luajit tests/lua_engine_nodedrops.lua
      - name: Legacy PseudoRandom golden vectors (Lua 5.4)
        run: lua5.4 tests/lua_engine_pseudorandom.lua
      - name: Same legacy RNG tests on LuaJIT
        run: luajit tests/lua_engine_pseudorandom.lua
      - name: Additional vector API checks (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_vector_extended.lua
          luajit tests/lua_engine_vector_extended.lua
      - name: Enchantment data serialization (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_serialization.lua
          luajit tests/lua_engine_serialization.lua
      - name: Build stand-alone lovr archive
        run: python3 scripts/package_lua_engine.py --output dist/Motor-Lua-Demo.lovr --require-upstream-textures
      - uses: actions/upload-artifact@v4
        with:
          name: Motor-Lua-Experimental-LOVR
          path: dist/Motor-Lua-Demo.lovr
          if-no-files-found: error
          retention-days: 30

  windows-demo:
    needs: api-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Pillow for real VoxeLibre textures
        run: python -m pip install pillow
      - name: Build Lua game archive
        run: python scripts/package_lua_engine.py --output dist/Motor-Lua-Demo.lovr --require-upstream-textures
      - name: Download LÖVR 0.19 Windows runtime and assemble fused .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/bjornbytes/lovr/releases/download/v0.19.0/lovr-v0.19.0-win64.zip' -OutFile 'lovr-runtime.zip'
          Expand-Archive -Path 'lovr-runtime.zip' -DestinationPath 'runtime'
          $runtime = Get-ChildItem 'runtime' -Filter 'lovr.exe' -Recurse -File | Select-Object -First 1
          if (-not $runtime) { throw 'Cannot find lovr.exe in official runtime' }
          $output = Join-Path (Get-Location) 'dist/Motor-Lua-Demo.exe'
          $outStream = [System.IO.File]::Create($output)
          try {
            $exe = [System.IO.File]::OpenRead($runtime.FullName)
            try { $exe.CopyTo($outStream) } finally { $exe.Dispose() }
            $game = [System.IO.File]::OpenRead((Join-Path (Get-Location) 'dist/Motor-Lua-Demo.lovr'))
            try { $game.CopyTo($outStream) } finally { $game.Dispose() }
          } finally { $outStream.Dispose() }
          Get-ChildItem $runtime.DirectoryName -Filter '*.dll' -File | Copy-Item -Destination 'dist'
          if (@(Get-ChildItem 'dist' -Filter '*.dll').Count -lt 1) { throw 'Missing DLLs' }
          if ((Get-Item $output).Length -le $runtime.Length) { throw 'Fused EXE is incomplete' }
      - name: Explain experimental status
        shell: pwsh
        run: |
          @'
          EXPERIMENTAL LUA ENGINE - DEMO
          ==============================
          Run Motor-Lua-Demo.exe after extracting the entire ZIP.
          WASD: move | mouse: look | Space/Ctrl: up/down | Shift: sprint
          Left click: remove node | Right click: place stone | F6: save

          IMPORTANT: Does not run VoxeLibre yet.
          Not a complete or 1:1 Luanti engine.
          Uses visible-face mapblock meshes with original VoxeLibre textures.
          License and credits: visual/licenses/ inside the .lovr archive.
          Upstream texture atlas contains first water animation frame only.
          It does not yet run the full VoxeLibre game.
          Visual behavior on a real Windows GPU has not been verified.
          Windows 64-bit and Vulkan-capable graphics are required.
          '@ | Set-Content -Path 'dist/LEIA-ME.txt' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Motor-Lua-Experimental-Windows-x64
          path: |
            dist/Motor-Lua-Demo.exe
            dist/*.dll
            dist/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 30

  voxelibre-audit:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install Lua for API export
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Boot original VoxeLibre mods under Lua 5.4
        run: |
          mkdir -p dist
          lua5.4 tests/lua_engine_real_voxelibre.lua games/voxelibre dist/VoxeLibre-Real-Mod-Boot.md
      - name: Boot same original mods under LuaJIT
        run: luajit tests/lua_engine_real_voxelibre.lua games/voxelibre
      - name: Probe real doc and doc_items dependencies (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 tests/lua_engine_doc_bootstrap.lua games/voxelibre dist/VoxeLibre-Doc-Bootstrap.md
          luajit tests/lua_engine_doc_bootstrap.lua games/voxelibre
      - name: Report directly referenced VoxeLibre APIs not yet exported
        run: |
          mkdir -p dist
          lua5.4 scripts/export_lua_engine_api.lua > dist/lua-engine-api-exports.txt
          python3 scripts/audit_voxelibre_api.py \
            --game games/voxelibre \
            --supported dist/lua-engine-api-exports.txt \
            --output dist/VoxeLibre-Lua-API-Audit.md
      - name: Analyze full required dependency chain for upstream mcl_core
        run: |
          python3 scripts/mcl_core_dependencies.py \
            --game games/voxelibre --mod mcl_core \
            --output dist/VoxeLibre-mcl_core-Dependencies.md
      - uses: actions/upload-artifact@v4
        with:
          name: VoxeLibre-Lua-API-Compatibility-Audit
          path: |
            dist/VoxeLibre-Lua-API-Audit.md
            dist/VoxeLibre-Real-Mod-Boot.md
            dist/VoxeLibre-Doc-Bootstrap.md
            dist/VoxeLibre-mcl_core-Dependencies.md
          if-no-files-found: error
          retention-days: 30
