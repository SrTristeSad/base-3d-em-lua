name: Lua checks and playable package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: World logic regression
        run: lua5.4 tests/world_basic.lua
      - name: Classic 0.30 modes and inventory tests
        run: lua5.4 tests/classic_basic.lua
      - name: Classic 0.30 blocks, new mobs and TNT regression
        run: |
          lua5.4 tests/blocks_030.lua
          lua5.4 tests/creatures_030.lua
      - name: Chunk streaming 64x64 and greedy meshing tests
        run: lua5.4 tests/streaming_64.lua
      - name: Cubic chunks 3D and vertical streaming tests
        run: lua5.4 tests/cubic_chunks_3d.lua
      - name: Seeds, image worlds and creation menu
        run: |
          lua5.4 tests/worldgen_seed.lua
          lua5.4 tests/worlds_menu.lua
      - name: FPS camera and UV mob skins regression
        run: |
          lua5.4 tests/camera_fps.lua
          lua5.4 tests/mob_skins_uv.lua
      - name: Classic 0.30 terrain and streamed mob spawning
        run: |
          lua5.4 tests/classic_030_terrain.lua
          lua5.4 tests/classic_030_spawning.lua
      - name: Beta 1.8.1 world foundation, biomes and world compatibility
        run: lua5.4 tests/beta181_world.lua
      - name: Creeper, combat and explosion tests
        run: lua5.4 tests/creepers_basic.lua
      - name: Verify playable sandbox integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('main.lua').read_text()
          player=Path('src/player.lua').read_text()
          world=Path('src/world.lua').read_text()
          mobs=Path('src/creepers.lua').read_text()
          ui=Path('src/ui.lua').read_text()
          assert "require('src.creepers')" in main
          assert "require('src.camera')" in main
          assert "require('src.mob_skins')" in main
          assert "require('src.mob_spawning')" in main
          assert "MobSpawn.new(world,creatures,creepers)" in main
          worlds=Path('src/worlds.lua').read_text()
          assert "version=='classic030'" in worlds
          assert "generatorVersion='beta181'" in worlds
          assert "require('src.beta181_terrain')" in world
          assert "Terrain:generateSection(" in Path('src/beta181_terrain.lua').read_text()
          assert "require('src.beta181_items')" in main
          assert "Textures.setProfile(world.generatorVersion)" in main
          assert "options.generatorVersion=='classic030'" in world
          assert "Terrain:cave(" in Path('src/classic_terrain.lua').read_text()
          assert 'Camera.look(player.yaw,player.pitch' in main
          assert 'player:camera(world)' in main
          assert 'skins:draw(pass,mob' in Path('src/creepers.lua').read_text()
          assert 'skins:draw(pass,mob,mob.kind)' in Path('src/creatures.lua').read_text()
          assert "'invertx'" in main and "'inverty'" in main
          assert "src.camera" in player
          assert 'creepers:update(dt,player,classic)' in main
          assert 'creepers:draw(pass,cx,cz' in main
          assert 'creepers:hit(player,1,classic)' in main
          assert "setState('dead')" in main
          assert 'function World:explode(' in world
          assert 'function Player:respawn(' in player
          assert 'function Creepers:explode(' in mobs
          assert "state=='dead'" in ui
          assert 'function Mesher.buildData(' in Path('src/mesher.lua').read_text()
          assert 'self.world:prune(px,py,pz,half,1)' in Path('src/mesher.lua').read_text()
          assert 'world:spawnHeight' in player
          assert 'mesher:sync(player.x,player.y,player.z,settings.distance,3)' in main
          assert 'function World:ensureSection(' in world
          assert 'function World:generateSection(' in world
          assert 'function World:prune(' in world
          assert 'function World:cacheCount(' in world
          assert 'local bottom=math.max(floor(self.world.YMIN/16),centerY-1)' in Path('src/mesher.lua').read_text()
          assert "require('src.creatures')" in main
          assert "require('src.tnt')" in main
          assert 'creatures:update(dt,player,classic)' in main
          assert 'creatures:hit(player,classic)' in main
          assert 'tnt:update(dt,player,classic)' in main
          assert 'tnt:defuse(player,classic)' in main
          assert 'function World:explode(' in world
          assert 'Classic.MAX_ID=46' in Path('src/classic.lua').read_text()
          assert 'T.MAX_ID=49' in Path('src/textures.lua').read_text()
          assert "require('src.classic')" in main
          assert "classic=Classic.new(world.savedMode" in main
          assert "UI.click(state,settings,x,y,w,h,classic,menu)" in main
          assert "require('src.worlds')" in main
          assert "Worlds.create(menu.name,menu.seed,'',menu.mode)" in main
          assert 'function Gen.fromImage(' in Path('src/worldgen.lua').read_text()
          assert 'function Worlds.open(' in Path('src/worlds.lua').read_text()
          assert "state=='create'" in main
          assert 'assets/worlds/demo.png' in Path('README.md').read_text() or Path('assets/worlds/demo.png').is_file()
          assert "world:save(player,classic)" in main
          assert "classic:mine(id)" in player
          assert "classic:place(id)" in player
          assert "function World:save(player,classic)" in world
          assert 'MODO: ' in ui
          required={'grass_top','grass_side','dirt','stone','wood_side',
                    'wood_top','leaves','sand','planks','bricks','water',
                    'cobble','gravel','gold_ore','iron_ore','coal_ore',
                    'mossy','slab','mushroom_brown','mushroom_red','lava',
                    'obsidian','sponge'}
          for item in required:
            p=Path('assets/textures')/(item+'.png')
            assert p.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10]), p
          demo=Path('assets/worlds/demo.png')
          assert demo.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          print('Beta 1.8.1 baseline + compatibilidade Classic + texturas: OK')
          PY
      - name: Package runnable LÖVR project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out=Path('dist/Base3D-Beta181-Overworld-Foundation.lovr')
          out.parent.mkdir(parents=True,exist_ok=True)
          files=[Path('main.lua'),Path('conf.lua'),Path('README.md'),Path('LICENSE')]
          files+=sorted(Path('src').rglob('*.lua'))
          files+=sorted(p for p in Path('assets').rglob('*') if p.is_file())
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=8) as z:
            for p in files:z.write(p,p.as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert 'main.lua' in z.namelist()
            assert 'conf.lua' in z.namelist()
            assert 'src/creepers.lua' in z.namelist()
            assert 'src/classic.lua' in z.namelist()
            assert 'src/creatures.lua' in z.namelist()
            assert 'src/tnt.lua' in z.namelist()
            assert 'src/mesher.lua' in z.namelist()
            assert 'src/world.lua' in z.namelist()
            assert 'assets/textures/grass_top.png' in z.namelist()
            assert 'assets/worlds/demo.png' in z.namelist()
            assert 'src/worldgen.lua' in z.namelist()
            assert 'src/worlds.lua' in z.namelist()
            assert 'src/camera.lua' in z.namelist()
            assert 'src/mob_skins.lua' in z.namelist()
            assert 'src/classic_terrain.lua' in z.namelist()
            assert 'src/mob_spawning.lua' in z.namelist()
            assert 'src/beta181_terrain.lua' in z.namelist()
            assert 'src/beta181_items.lua' in z.namelist()
            assert 'assets/skins/mobs/README.md' in z.namelist()
          print(out,out.stat().st_size,'bytes',len(files),'files')
          PY
      - name: Publish playable project
        uses: actions/upload-artifact@v4
        with:
          name: Base3D-Beta181-Overworld-Foundation-LOVR
          path: dist/Base3D-Beta181-Overworld-Foundation.lovr
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: Windows portable test (.exe)
    needs: syntax-and-world
    runs-on: windows-latest
    steps:
      - name: Download verified game package
        uses: actions/download-artifact@v4
        with:
          name: Base3D-Beta181-Overworld-Foundation-LOVR
          path: game
      - name: Fuse LÖVR runtime with game for Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/bjornbytes/lovr/releases/download/v0.19.0/lovr-v0.19.0-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile 'lovr-win64.zip'
          Expand-Archive -Path 'lovr-win64.zip' -DestinationPath 'runtime'
          $runtime = Get-ChildItem 'runtime' -Filter 'lovr.exe' -Recurse -File | Select-Object -First 1
          $archive = Get-ChildItem 'game' -Filter '*.lovr' -Recurse -File | Select-Object -First 1
          if (-not $runtime) { throw 'The official runtime has no lovr.exe' }
          if (-not $archive) { throw 'The validated game artifact is missing' }
          New-Item -ItemType Directory -Path 'dist/Base3D-Windows' -Force | Out-Null
          $output = Join-Path (Get-Location) 'dist/Base3D-Windows/Base3D-Beta181-Overworld-Foundation.exe'
          # LÖVR supports a fused Windows executable: runtime bytes + .lovr zip.
          $outStream = [System.IO.File]::Create($output)
          try {
            $exeStream = [System.IO.File]::OpenRead($runtime.FullName)
            try { $exeStream.CopyTo($outStream) } finally { $exeStream.Dispose() }
            $gameStream = [System.IO.File]::OpenRead($archive.FullName)
            try { $gameStream.CopyTo($outStream) } finally { $gameStream.Dispose() }
          } finally { $outStream.Dispose() }
          # Ship the original runtime DLL dependencies next to the fused exe.
          Get-ChildItem $runtime.DirectoryName -Filter '*.dll' -File |
            Copy-Item -Destination 'dist/Base3D-Windows'
          $dllCount = @(Get-ChildItem 'dist/Base3D-Windows' -Filter '*.dll').Count
          if ($dllCount -lt 1) { throw 'Required LÖVR runtime DLLs missing' }
          $file = Get-Item $output
          if ($file.Length -le $runtime.Length) { throw 'The archive was not fused into the exe' }
          $header = [System.IO.File]::ReadAllBytes($output)
          if ($header[0] -ne 77 -or $header[1] -ne 90) { throw 'Output is not a Windows executable' }
          "Windows portable executable: $($file.Length) bytes, DLLs: $dllCount"
      - name: Include first-run instructions
        shell: pwsh
        run: |
          @'
          BASE 3D - TESTE WINDOWS (64 bits)
          =================================
          1. Extraia o arquivo ZIP inteiro para uma pasta.
          2. Execute Base3D-Beta181-Overworld-Foundation.exe.
          3. No menu escolha CRIAR NOVO MUNDO e informe uma semente.
          4. Escolha SOBREVIVENCIA ou CRIATIVO. Sem geracao por imagem.
          5. Beta 1.8.1 FASE 1: biomas, continentes, rios, cavernas,
             minérios, mundo Y=0..127 e nove slots visuais.
          6. Ainda NAO ha fome, crafting, Nether, cama ou inventario
             completo; mobs continuam provisórios.
          7. E possivel jogar sem Minecraft ou Roblox instalados.

          Exige Windows 10+ 64 bits e GPU/driver compatível com Vulkan.
          O Microsoft Visual C++ Runtime pode ser necessario.
          O programa nao tem assinatura de codigo (pode mostrar aviso
          do SmartScreen). Nao desligue seu antivirus.
          O motor LÖVR v0.19.0 e seus DLLs foram obtidos do lancamento
          oficial: https://github.com/bjornbytes/lovr/releases/tag/v0.19.0
          Projeto: https://github.com/SrTristeSad/base-3d-em-lua
          Versao ainda experimental: renderizacao nao foi validada em GPU real.
          '@ | Set-Content -Path 'dist/Base3D-Windows/LEIA-ME.txt' -Encoding UTF8
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Base3D-Beta181-Overworld-Foundation-Windows-EXE
          path: dist/Base3D-Windows/
          if-no-files-found: error
          retention-days: 30
